<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房貸月付金即時試算｜住商不動產 林佳麒 C.C.LIN</title>
  <style>
    :root {
      --primary: #006837;
      --primary-dark: #004d28;
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #dce5df;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .container { width: 100%; max-width: 460px; background: var(--card); border-radius: 16px; padding: 22px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; }
    .header h1 { margin: 0; font-size: 20px; color: var(--primary); }
    .header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .form-group { margin-bottom: 14px; }
    label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    label span { color: var(--primary); font-weight: 700; font-size: 12px; }
    input[type="number"], select {
      width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border);
      border-radius: 10px; background: #fafcfb; outline: none;
    }
    input[type="number"]:focus, select:focus { border-color: var(--primary); background: #fff; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #eaf1ec; padding: 4px; border-radius: 10px; margin-bottom: 16px; }
    .tab { text-align: center; padding: 8px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--muted); transition: 0.2s; }
    .tab.active { background: var(--primary); color: #fff; }
    .rate-presets { display: flex; gap: 6px; margin-top: 6px; }
    .preset-btn {
      flex: 1; padding: 6px 4px; font-size: 12px; background: #eef5f1; color: var(--primary);
      border: 1px solid #cce3d5; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .preset-btn:active { background: var(--primary); color: #fff; }
    .result-box { background: #f0f7f3; border: 1px solid #cce3d5; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .result-main { text-align: center; padding-bottom: 12px; border-bottom: 1px dashed #b9d6c4; }
    .result-main .title { font-size: 13px; color: var(--muted); }
    .result-main .amount { font-size: 28px; font-weight: 800; color: var(--primary); margin: 4px 0; }
    .result-details { margin-top: 12px; font-size: 13px; display: grid; gap: 6px; }
    .detail-row { display: flex; justify-content: space-between; }
    .detail-row span:last-child { font-weight: 600; }
    .cta-btn {
      display: block; width: 100%; text-align: center; margin-top: 18px; padding: 13px;
      background: var(--primary); color: #fff; text-decoration: none; font-weight: 700;
      font-size: 15px; border-radius: 10px; transition: 0.2s;
    }
    .cta-btn:active { background: var(--primary-dark); }
    .note { text-align: center; font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>房貸月付金即時試算</h1>
      <p>住商不動產 建國民生加盟店｜林佳麒 C.C.LIN</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-pi" onclick="setMode('pi')">本息平均攤還</div>
      <div class="tab" id="tab-p" onclick="setMode('p')">本金平均攤還</div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>房屋總價 (萬元)</label>
        <input type="number" id="price" value="2500" min="100" step="50" oninput="calc()">
      </div>
      <div class="form-group">
        <label>貸款成數 (%)</label>
        <input type="number" id="ltv" value="70" min="10" max="90" step="5" oninput="calc()">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>貸款年限</label>
        <select id="years" onchange="calc()">
          <option value="20">20 年 (240期)</option>
          <option value="30" selected>30 年 (360期)</option>
          <option value="40">40 年 (480期)</option>
        </select>
      </div>
      <div class="form-group">
        <label>寬限期</label>
        <select id="grace" onchange="calc()">
          <option value="0" selected>無寬限期</option>
          <option value="1">1 年</option>
          <option value="2">2 年</option>
          <option value="3">3 年</option>
          <option value="5">5 年</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>年利率 (%) <span>可自由輸入或點選下方參考</span></label>
      <input type="number" id="rate" value="2.50" min="0.5" max="10" step="0.01" oninput="calc()">
      <div class="rate-presets">
        <button type="button" class="preset-btn" onclick="setRate(1.775)">新青安 1.775%</button>
        <button type="button" class="preset-btn" onclick="setRate(2.50)">首購行情 2.50%</button>
        <button type="button" class="preset-btn" onclick="setRate(2.85)">一般/二房 2.85%</button>
      </div>
    </div>

    <div class="result-box">
      <div class="result-main">
        <div class="title" id="main-label">寬限期後每月應付本息</div>
        <div class="amount" id="monthly-pay">$0 元</div>
        <div class="title" id="grace-info" style="color:#006837; font-weight:600;"></div>
      </div>
      <div class="result-details">
        <div class="detail-row"><span>自備款金額：</span><span id="down-pay">0 萬</span></div>
        <div class="detail-row"><span>貸款總金額：</span><span id="loan-amt">0 萬</span></div>
        <div class="detail-row"><span>預估總利息支出：</span><span id="total-interest">0 萬</span></div>
      </div>
    </div>

    <a href="tel:0968783477" class="cta-btn">📞 免費評估銀行成數與稅費｜撥打 0968-783-477</a>
    <div class="note">※ 試算結果僅供參考，實際核貸成數與利率依各銀行審核為準</div>
  </div>

  <script>
    let mode = 'pi';
    function setMode(m) {
      mode = m;
      document.getElementById('tab-pi').classList.toggle('active', m === 'pi');
      document.getElementById('tab-p').classList.toggle('active', m === 'p');
      calc();
    }
    function setRate(val) {
      document.getElementById('rate').value = val;
      calc();
    }
    function fmt(num) {
      return Math.round(num).toLocaleString('zh-TW');
    }
    function calc() {
      const price = parseFloat(document.getElementById('price').value) || 0;
      const ltv = parseFloat(document.getElementById('ltv').value) || 0;
      const years = parseInt(document.getElementById('years').value) || 30;
      const grace = parseInt(document.getElementById('grace').value) || 0;
      const rate = parseFloat(document.getElementById('rate').value) || 0;

      const loanWan = price * (ltv / 100);
      const downWan = price - loanWan;
      const loanYuan = loanWan * 10000;
      const r = (rate / 100) / 12;
      const totalMonths = years * 12;
      const graceMonths = Math.min(grace * 12, totalMonths - 12);
      const payMonths = totalMonths - graceMonths;

      const graceMonthly = loanYuan * r;
      let postMonthly = 0;
      let totalInterest = graceMonthly * graceMonths;

      if (mode === 'pi') {
        document.getElementById('main-label').innerText = graceMonths > 0 ? '寬限期後每月固定月付金' : '每月固定月付金（本息平均）';
        if (r === 0) {
          postMonthly = loanYuan / payMonths;
        } else {
          const factor = Math.pow(1 + r, payMonths);
          postMonthly = loanYuan * (r * factor) / (factor - 1);
        }
        totalInterest += (postMonthly * payMonths) - loanYuan;
        document.getElementById('monthly-pay').innerText = '$' + fmt(postMonthly) + ' 元';
      } else {
        document.getElementById('main-label').innerText = graceMonths > 0 ? '寬限期後首月月付金（逐月遞減）' : '首月最高月付金（本金平均）';
        const monthlyPrincipal = loanYuan / payMonths;
        postMonthly = monthlyPrincipal + (loanYuan * r);
        totalInterest += ((loanYuan * r + monthlyPrincipal * r) / 2) * payMonths;
        document.getElementById('monthly-pay').innerText = '$' + fmt(postMonthly) + ' 元';
      }

      const graceEl = document.getElementById('grace-info');
      if (graceMonths >
