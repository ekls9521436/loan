<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房貸月付金即時試算表｜C.C.LIN (CCLIN)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23006837'/><text x='50' y='65' font-family='sans-serif' font-size='44' font-weight='bold' fill='white' text-anchor='middle'>CC</text></svg>">
  <style>
    :root { --primary: #006837; --bg: #f4f7f5; --card: #ffffff; --text: #222; --muted: #666; --border: #dce5df; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
    .container { width: 100%; max-width: 460px; background: var(--card); border-radius: 16px; padding: 22px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
    .header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 18px; }
    .header h1 { margin: 0; font-size: 20px; color: var(--primary); }
    .form-group { margin-bottom: 14px; min-width: 0; }
    label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    label span { color: var(--primary); font-size: 12px; }
    input, select { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 10px; background: #fafcfb; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #eaf1ec; padding: 4px; border-radius: 10px; margin-bottom: 16px; }
    .tab { text-align: center; padding: 8px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .tab.active { background: var(--primary); color: #fff; }
    .rate-presets { display: flex; gap: 6px; margin-top: 6px; }
    .preset-btn { flex: 1; padding: 7px 4px; font-size: 12px; background: #eef5f1; color: var(--primary); border: 1px solid #cce3d5; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .rate-note { font-size: 11px; color: #888; text-align: right; margin-top: 6px; }
    .result-box { background: #f0f7f3; border: 1px solid #cce3d5; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .result-main { text-align: center; padding-bottom: 12px; border-bottom: 1px dashed #b9d6c4; }
    .result-main .title { font-size: 13px; color: var(--muted); }
    .result-main .amount { font-size: 28px; font-weight: 800; color: var(--primary); margin: 4px 0; }
    .result-details { margin-top: 12px; font-size: 13px; display: grid; gap: 6px; }
    .detail-row { display: flex; justify-content: space-between; }
    .detail-row span:last-child { font-weight: 600; }
    .schedule-toggle {
      width: 100%; margin-top: 14px; padding: 10px; background: #fff; color: var(--primary);
      border: 1px solid var(--primary); border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .schedule-wrap { display: none; margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .schedule-scroll { max-height: 280px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
    th { position: sticky; top: 0; background: #eef5f1; color: var(--primary); padding: 8px 6px; font-weight: 700; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: center; }
    td { padding: 7px 6px; border-bottom: 1px solid #f0f0f0; }
    tr:nth-child(even) { background: #fafcfb; }
    .more-btn { width: 100%; padding: 8px; background: #f4f7f5; border: none; border-top: 1px solid var(--border); color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; }
    .cta-btn { display: block; width: 100%; text-align: center; margin-top: 16px; padding: 12px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 700; font-size: 15px; line-height: 1.45; border-radius: 10px; transition: background 0.2s; }
    .cta-btn:hover { background: #00522b; }
    .btn-sub { display: block; font-size: 13px; font-weight: 500; opacity: 0.92; margin-top: 2px; }
    .note { text-align: center; font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>房貸月付金即時試算表</h1>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-pi" onclick="setMode('pi')">本息平均攤還</div>
      <div class="tab" id="tab-p" onclick="setMode('p')">本金平均攤還</div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>房屋總價 (萬元)</label>
        <input type="text" inputmode="numeric" id="price" value="0" oninput="handleIntInput(this)" onfocus="this.select()">
      </div>
      <div class="form-group">
        <label>貸款成數 (%)</label>
        <input type="text" inputmode="numeric" id="ltv" value="70" oninput="handleIntInput(this)" onfocus="this.select()">
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>貸款年限</label>
        <select id="years" onchange="calc()">
          <option value="20">20 年 (240期)</option>
          <option value="30" selected>30 年 (360期)</option>
          <option value="40">40 年 (480期)</option>
        </select>
      </div>
      <div class="form-group">
        <label>寬限期</label>
        <select id="grace" onchange="calc()">
          <option value="0" selected>無寬限期</option>
          <option value="1">1 年</option>
          <option value="2">2 年</option>
          <option value="3">3 年</option>
          <option value="5">5 年</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>年利率 (%) <span>可自由輸入或點選參考</span></label>
      <input type="text" inputmode="decimal" id="rate" value="0" oninput="handleDecInput(this)" onfocus="this.select()">
      <div class="rate-presets">
        <button type="button" class="preset-btn" onclick="setRate(2.85)">一般/二房 2.85%</button>
        <button type="button" class="preset-btn" onclick="setRate(2.50)">首購行情 2.50%</button>
        <button type="button" class="preset-btn" onclick="setRate(1.775)">新青安 1.775%</button>
      </div>
      <div class="rate-note">※ 參考 2026 Q4 市場行情（實際利率依個人條件與銀行核貸為準）</div>
    </div>
    <div class="result-box">
      <div class="result-main">
        <div class="title" id="main-label">每月固定月付金（本息平均）</div>
        <div class="amount" id="monthly-pay">$0 元</div>
        <div class="title" id="grace-info" style="color:#006837; font-weight:600;"></div>
      </div>
      <div class="result-details">
        <div class="detail-row"><span>自備款金額：</span><span id="down-pay">0 萬元</span></div>
        <div class="detail-row"><span>貸款總金額：</span><span id="loan-amt">0 萬元</span></div>
        <div class="detail-row"><span>預估總利息支出：</span><span id="total-interest">0.0 萬元</span></div>
      </div>
    </div>

    <button type="button" class="schedule-toggle" id="toggle-btn" onclick="toggleSchedule()">📊 查看各期本息攤還明細表 ▼</button>
    <div class="schedule-wrap" id="schedule-wrap">
      <div class="schedule-scroll">
        <table>
          <thead>
            <tr>
              <th>期數</th>
              <th>月付總額</th>
              <th>償還本金</th>
              <th>支付利息</th>
              <th>剩餘本金(萬)</th>
            </tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
      <button type="button" class="more-btn" id="more-btn" onclick="showAllRows()">顯示全部期數 ▼</button>
    </div>

    <a href="https://ekls9521436.github.io/" class="cta-btn">
      林佳麒 C.C.LIN (CCLIN)
      <span class="btn-sub">聯繫｜試算諮詢 住商不動產</span>
    </a>
    <div class="note">※ 試算結果僅供參考，實際核貸成數與利率依各銀行審核為準</div>
  </div>
  <script>
    var mode = 'pi';
    var scheduleData = [];
    var showAll = false;

    function handleIntInput(el) {
      var v = el.value.replace(/[^0-9]/g, '');
      if (v === '') {
        v = '0';
      } else if (v.length > 1) {
        v = v.replace(/^0+/, '') || '0';
      }
      el.value = v;
      calc();
    }

    function handleDecInput(el) {
      var v = el.value.replace(/[^0-9.]/g, '');
      var parts = v.split('.');
